name: P12 Real-world scanner intake

on:
  push:
    paths:
      - .github/workflows/p12-real-world-scan.yml
      - scripts/run-external-corpus-scan.mjs
      - src/analyzer/**
      - src/scanner/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan ${{ matrix.id }} — ${{ matrix.repository }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: RW-TS-02
            repository: better-auth/better-auth
            ref: de6ef28b86c002c3a3683861d803daf482ec603f
          - id: RW-PY-05
            repository: paperless-ngx/paperless-ngx
            ref: 32bc5522e914f1e5f3a36eb60de6988611ca310f
          - id: RW-PY-07
            repository: PrefectHQ/prefect
            ref: b0479c0c26045b06321191bbad0cdfbb334d7380
          - id: RW-TS-06
            repository: immich-app/immich
            ref: 87ef895041e160aef4f61f2d7af1ad3f8e38827d
          - id: RW-GO-01
            repository: go-gitea/gitea
            ref: edebfaa12516a140d7ee3fcbaf25a6a1cc2cdb76
          - id: RW-RS-03
            repository: vercel/turborepo
            ref: 17691acd9bc80171e5ef4b3532ff0748ba231813
          - id: RW-EX-04
            repository: plausible/analytics
            ref: 31fc1910fe9be0362b27dacbd2886f16442da20f
    steps:
      - name: Check out OIOL planner
        uses: actions/checkout@v4
        with:
          path: planner
          persist-credentials: false

      - name: Check out public candidate repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: planner/package-lock.json

      - name: Install OIOL dependencies only
        working-directory: planner
        run: npm ci

      - name: Run bounded read-only scanner
        working-directory: planner
        run: |
          node scripts/run-external-corpus-scan.mjs \
            --repo ../candidate \
            --id "${{ matrix.id }}" \
            --out "scan-results/${{ matrix.id }}.json"

      - name: Upload scanner evidence report
        uses: actions/upload-artifact@v4
        with:
          name: p12-scan-${{ matrix.id }}
          path: planner/scan-results/${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 30
