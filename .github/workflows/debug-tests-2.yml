name: Debug tests 2
on:
  push:
    branches: [feat/quality-stack-integration]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run tests and capture diagnostics
        shell: bash
        run: |
          set +e
          TAP="$RUNNER_TEMP/test-output.tap"
          node --test --test-reporter=tap > "$TAP" 2>&1
          code=$?
          {
            echo "exit=$code"
            wc -l "$TAP"
            grep -n -A 40 -E "^not ok" "$TAP" | head -400
            echo "--- tail ---"
            tail -n 400 "$TAP"
            echo "--- git status ---"
            git status --porcelain=v1
          } > test-failures.txt
          exit 0
      - name: Publish diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-artifacts
          git add -f test-failures.txt
          git commit -m "debug: capture test failures and git status"
          git push -f origin debug-artifacts
