name: P12 provider probe

on:
  push:
    branches: ['p12/**']
    paths: ['.p12/probe']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: p12-provider-probe-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe configured providers
        env:
          P12_API_KEY_R1: ${{ secrets.OIOL_API_KEY }}
          P12_API_KEY_R2: ${{ secrets.OIOL_REVIEW_API_KEY }}
          P12_MODELS_BASE_R1: https://integrate.api.nvidia.com/v1
          P12_MODELS_BASE_R2: https://openrouter.ai/api/v1
          P12_MODELS_URL_R1: https://integrate.api.nvidia.com/v1/chat/completions
          P12_MODELS_URL_R2: https://integrate.api.nvidia.com/v1/chat/completions
          P12_MODEL_R1: nvidia/llama-3.1-nemotron-51b-instruct
          P12_MODEL_R2: deepseek-ai/deepseek-v4.1-flash
          P12_SWEEP_SLOT: R1
          P12_SWEEP_TOKENS: '1024'
          P12_MODEL_CANDIDATES: nvidia/llama-3.1-nemotron-51b-instruct,nvidia/llama-3.1-nemotron-ultra-253b-v1,nvidia/nemotron-4-340b-instruct,nvidia/nemotron-3-super-120b-a12b,nvidia/nemotron-3-ultra-550b-a55b,nvidia/nemotron-nano-3-30b-a3b,nvidia/nemotron-3.5-lightning-30b-a3b,openai/gpt-oss-20b,deepseek-ai/deepseek-v4.1-flash,deepseek-ai/deepseek-coder-6.7b-instruct,mistralai/mistral-large-2-instruct,mistralai/mistral-large-4-1t-a52b,mistralai/mistral-7b-instruct-v0.3,nv-mistralai/mistral-nemo-12b-instruct,nvidia/mistral-nemo-minitron-8b-8k-instruct,google/gemma-3-12b-it,google/gemma-4-31b-it,ibm/granite-3.0-8b-instruct,z-ai/glm-5.3-flash,minimaxai/minimax-m3.1-flash,moonshotai/kimi-k2.6,microsoft/phi-3.5-moe-instruct,meta/codellama-70b,nvidia/llama3-chatqa-1.5-70b
        run: node scripts/probe-model-providers.mjs

      - name: Commit probe report
        if: always()
        shell: bash
        env:
          P12_BRANCH: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          report="benchmarks/real-world/reviews/.p12-provider-probe.json"
          clone="$RUNNER_TEMP/probe-clone"
          if [ ! -f "$report" ]; then echo "No probe report produced"; exit 0; fi
          cp "$report" "$RUNNER_TEMP/probe-report.json"
          url=$(git config --get remote.origin.url)
          git clone --quiet --depth 5 --branch "$P12_BRANCH" "$url" "$clone"
          for key in $(git config --get-regexp "^http\." | cut -d" " -f1); do
            git -C "$clone" config "$key" "$(git config --get "$key")"
          done
          mkdir -p "$clone/benchmarks/real-world/reviews"
          cp "$RUNNER_TEMP/probe-report.json" "$clone/benchmarks/real-world/reviews/.p12-provider-probe.json"
          git -C "$clone" config user.name "oiol-p12-bot"
          git -C "$clone" config user.email "oiol-p12-bot@users.noreply.github.com"
          git -C "$clone" add -A benchmarks/real-world/reviews/.p12-provider-probe.json
          if git -C "$clone" diff --cached --quiet; then echo "Probe report unchanged"; exit 0; fi
          git -C "$clone" commit --quiet -m "chore(p12): record provider probe report"
          git -C "$clone" push --quiet origin "HEAD:refs/heads/$P12_BRANCH"
