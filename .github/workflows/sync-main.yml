name: Sync main into integration branch

on:
  push:
    branches: [feat/quality-stack-integration]
    paths:
      - '.merge/package.json'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quality-stack-integration
          fetch-depth: 0
      - name: Merge main with prepared resolutions
        run: |
          set -e
          git config user.name "oiol-integration-bot"
          git config user.email "oiol-integration-bot@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-commit || true
          test -f .merge/README.md
          test -f .merge/CHANGELOG.md
          test -f .merge/package.json
          cp .merge/README.md README.md
          cp .merge/CHANGELOG.md CHANGELOG.md
          cp .merge/package.json package.json
          rm -rf .merge
          rm -f .github/workflows/sync-main.yml
          git add -A
          git status --short
          git commit -m "Merge main into quality stack integration branch"
          git push origin HEAD:feat/quality-stack-integration
