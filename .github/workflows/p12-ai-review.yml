name: P12 AI review generation

on:
  push:
    branches: ['p12/**']
    paths: ['.p12/trigger']
  workflow_dispatch:
    inputs:
      slots:
        description: 'Comma-separated reviewer slots'
        default: 'R1,R2'
      limit:
        description: 'Number of cases to annotate (0 = all)'
        default: '0'

permissions:
  contents: write
  models: read

concurrency:
  group: p12-ai-review
  cancel-in-progress: false

jobs:
  annotate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate AI reviews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          P12_SLOTS: ${{ inputs.slots || 'R1,R2' }}
          P12_MODEL_R1: openai/gpt-4o-mini
          P12_MODEL_R2: meta/llama-3.3-70b-instruct
          P12_SKIP_EXISTING: '0'
          LIMIT: ${{ inputs.limit || '0' }}
        run: node scripts/generate-ai-reviews.mjs --limit "$LIMIT"

      - name: Commit generated reviews
        run: |
          git config user.name "oiol-p12-bot"
          git config user.email "oiol-p12-bot@users.noreply.github.com"
          git add benchmarks/real-world/reviews
          if git diff --cached --quiet; then
            echo "No review changes to commit"
            exit 0
          fi
          git commit -m "review(p12): generate AI annotations"
          git push origin HEAD:${{ github.ref_name }}
