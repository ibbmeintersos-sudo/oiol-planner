name: Debug tests
on:
  push:
    branches: [feat/quality-stack-integration]
    paths:
      - .github/workflows/debug-tests.yml
permissions:
  contents: read
jobs:
  debug:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run tests with TAP
        shell: bash
        run: |
          set +e
          node --test --test-reporter=tap > test-output.tap 2>&1
          code=$?
          echo "test exit code: $code"
          grep -E "^not ok|^# fail|AssertionError|Error:|expected:|actual:" test-output.tap | head -80 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          echo "## TAP tail" >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          tail -150 test-output.tap >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          exit $code
