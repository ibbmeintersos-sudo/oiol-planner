name: Unpack OIOL source archive

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    if: "!contains(github.event.head_commit.message, '[unpack-bot]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract project into repository root
        shell: bash
        run: |
          set -euo pipefail
          archive="oiol-planner-v0.1.0-reconstructed.tar.gz"
          test -f "$archive"
          mkdir -p /tmp/oiol-source
          tar -tzf "$archive" | grep -q '^oiol-planner/'
          tar -xzf "$archive" -C /tmp/oiol-source --strip-components=1
          cp -a /tmp/oiol-source/. .
          rm "$archive"

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes."
            exit 0
          fi
          git commit -m "[unpack-bot] Extract OIOL Planner source archive"
          git push
