name: One-time OIOL archive extraction

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: hashFiles('oiol-planner-v0.1.0-reconstructed.tar.gz') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract project into repository root
        shell: bash
        run: |
          set -euo pipefail
          archive="oiol-planner-v0.1.0-reconstructed.tar.gz"
          mkdir -p /tmp/oiol-source
          tar -tzf "$archive" | grep -q '^oiol-planner/'
          tar -xzf "$archive" -C /tmp/oiol-source --strip-components=1
          cp -a /tmp/oiol-source/. .
          rm "$archive"
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extract OIOL source archive"
          git push
